<ng-container *ngIf="{value: schedulersLoaded$ | async} as context">
  <div *ngIf="!context.value">
    <div class="text-center">
      <div class="spinner-border text-secondary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <br />
    </div>
    <br />
  </div>
</ng-container>

<div *ngIf="monthlyTaskSchedulers$ | async as tasks" class="container content">
    <div class="mx-2 pd-1">
      <hr class="thick-br"/>
      <h3>Monthly Task Schedulers</h3>
      <h5>{{ tasks.length }} Monthly Task Schedulers(s)</h5>
      <hr class="thin-br"/>
      <div class="table-responsive">
      <h6 class="text-center small-scr">
        (Turn Horizontal to Delete)
      </h6>
    <hr class="thin-br small-scrn" />
        <table class="table">
          <thead>
            <tr class="row">
              <th class="col"><h6>Day of Month</h6></th>
              <th class="col"><h6>Task Name</h6></th>
              <th class="col hidden-small"><h6>Delete</h6></th>
            </tr>
          </thead>
          <tbody>
            <div *ngFor="let monthlyTaskScheduler of tasks; trackBy: trackByFn">
              <app-monthly-task [monthlyTaskScheduler]=monthlyTaskScheduler>
              </app-monthly-task>
            </div>
          </tbody>
        </table>
        <hr class="thick-br"/>
      </div>
    </div>
  </div>
