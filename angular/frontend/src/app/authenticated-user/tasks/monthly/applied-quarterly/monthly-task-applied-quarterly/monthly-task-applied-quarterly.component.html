<tr class="row" >
    <th class="col">
      <p class>
        <app-monthly-task-template-string
          [monthlyTaskId]=monthlyTaskAppliedQuarterly.monthly_task_scheduler>
        </app-monthly-task-template-string>
      </p>
    </th>
    <th class="col hidden-small">
      <div *ngIf="!deletionPopupVisible; else delMonthlyTask" class="col text-left">
        <p>
          <button
            class="btn btn-sm btn-dark"
            (click)="showDeletionPopup()"
            >
            Remove
          </button>
        </p>
      </div>
      <ng-template #delMonthlyTask class="row">
        <div class="col">
          <p>
            <button
              class="btn btn-sm btn-outline-dark"
              (click)="hideDeletionPopup()">
              Cancel Deletion
            </button>
          </p>
        </div>
        <div class="col">
          <p>
            <button
              class="btn btn-sm btn-outline-danger"
              (click)="onRemoveMTAQ()"
              >
              Confirm Removal
            </button>
          </p>
        </div>
      </ng-template>
    </th>
</tr>
