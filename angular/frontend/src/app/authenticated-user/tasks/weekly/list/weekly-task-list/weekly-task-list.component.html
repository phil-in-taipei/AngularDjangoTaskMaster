<ng-container *ngIf="{value: schedulersLoaded$ | async} as context">
  <div *ngIf="!context.value">
    <div class="text-center">
      <div class="spinner-border text-secondary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <br />
    </div>
    <br />
  </div>
</ng-container>

<div *ngIf="weeklyTaskSchedulers$ | async as weeklyTaskSchedulers" class="content">
    <div class="mx-2 pd-1">
      <hr class="thin-br"/>
      <h3>Weekly Task Schedulers</h3>
      <h5>{{ weeklyTaskSchedulers.length }} Weekly Task Schedulers(s)</h5>
      <hr class="thin-br" />
      <h6 class="text-center small-scr">
        (Turn Horizontal to Delete)
      </h6>
      <hr class="thin-br small-scr" />
      <table class="table table-border-less">
          <thead class="table-border-less">
            <tr class="row">
              <th class="col"><h6>Day of Week</h6></th>
              <th class="col"><h6>Task Name</h6></th>
              <th class="col small-scr"><h6>Delete</h6></th>
            </tr>
          </thead>
          <tbody class="table-border-less">
            <div *ngFor="let weeklyTaskScheduler of weeklyTaskSchedulers; trackBy: trackByFn" >
              <app-weekly-task [weeklyTaskScheduler]=weeklyTaskScheduler>
              </app-weekly-task>
            </div>
          </tbody>
      </table>
      <hr class="thick-br"/>
  </div>
</div>
